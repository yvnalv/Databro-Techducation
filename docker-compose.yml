# DataBro — local development infrastructure.
#
# Two ways to run, both reading credentials/ports from ./.env:
#
#   docker compose up -d                     infra only (PostgreSQL, Redis, MinIO).
#                                            Run the API and Nuxt apps on the host —
#                                            fastest inner loop. This is the default.
#
#   docker compose --profile apps up -d      infra + API + both Nuxt apps, all containerised
#                                            with hot reload against bind-mounted source.
#                                            Use for full-stack / integration testing.
#
# See docs/LOCAL_DEVELOPMENT.md.

services:
  postgres:
    image: postgres:16-alpine
    container_name: databro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-databro}
      POSTGRES_USER: ${POSTGRES_USER:-databro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-databro_dev_pw}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-databro} -d ${POSTGRES_DB:-databro}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: databro-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: databro-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-databro}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-databro_dev_pw}
    ports:
      - "${MINIO_PORT:-9000}:9000"       # S3 API
      - "${MINIO_CONSOLE_PORT:-9001}:9001" # Web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # --- Application services (profile: apps) -------------------------------------------
  # Opt-in. Source is bind-mounted; both stacks watch and reload on change.

  api:
    profiles: ["apps"]
    build:
      context: ./backend
      target: dev
    container_name: databro-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      # Media provisions its dev bucket at startup; without this the API can start first and log a
      # warning instead, leaving uploads failing until it is restarted.
      minio:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      # Container-network overrides for the host-oriented appsettings.Development.json.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-databro};Username=${POSTGRES_USER:-databro};Password=${POSTGRES_PASSWORD:-databro_dev_pw}"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Key: ${JWT_KEY:-dev-only-super-secret-signing-key-change-me-please-32b+}
      # Two different addresses for the same MinIO, and they must stay different: the API reaches it
      # over the container network, while an <img> tag is resolved by the reader's browser, which
      # cannot resolve "minio".
      Media__Endpoint: "http://minio:9000"
      Media__PublicBaseUrl: "http://localhost:${MINIO_PORT:-9000}"
      Media__AccessKey: ${MINIO_ROOT_USER:-databro}
      Media__SecretKey: ${MINIO_ROOT_PASSWORD:-databro_dev_pw}
    ports:
      - "${API_PORT:-5158}:8080"
    volumes:
      - ./backend:/src
      # Keep the container's build output off the Windows host tree (see backend/Dockerfile).
      - api-artifacts:/artifacts
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  site:
    profiles: ["apps"]
    build:
      context: ./frontend
      target: dev
      args:
        APP: site
    container_name: databro-site
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Browser-visible, so it must be the host-published API port, not the service name.
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-5158}
      # Server-side (SSR/prerender) the API is a sibling container: `localhost` here would be the
      # site container itself. These are genuinely two different addresses for the same API.
      NUXT_API_INTERNAL_BASE_URL: http://api:8080
      NUXT_PUBLIC_SITE_URL: http://localhost:${SITE_PORT:-3000}
    ports:
      - "${SITE_PORT:-3000}:3000"
    volumes:
      - ./frontend:/workspace
      # Anonymous volumes so the bind mount does not shadow the image's installed deps.
      - /workspace/node_modules
      - /workspace/apps/site/node_modules
      - /workspace/apps/app/node_modules
      - /workspace/packages/ui/node_modules
      - /workspace/packages/api-client/node_modules
      - /workspace/packages/types/node_modules
      - /workspace/apps/site/.nuxt

  app:
    profiles: ["apps"]
    build:
      context: ./frontend
      target: dev
      args:
        APP: app
    container_name: databro-app
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-5158}
      NUXT_API_INTERNAL_BASE_URL: http://api:8080
      # Where the CMS's "view site" link points — the public app is a separate deployment.
      NUXT_PUBLIC_SITE_URL: http://localhost:${SITE_PORT:-3000}
    ports:
      - "${APP_PORT:-3001}:3000"
    volumes:
      - ./frontend:/workspace
      - /workspace/node_modules
      - /workspace/apps/site/node_modules
      - /workspace/apps/app/node_modules
      - /workspace/packages/ui/node_modules
      - /workspace/packages/api-client/node_modules
      - /workspace/packages/types/node_modules
      - /workspace/apps/app/.nuxt

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-artifacts:
